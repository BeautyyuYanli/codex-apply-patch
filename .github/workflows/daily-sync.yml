name: Sync OpenAI Codex apply-patch

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-openai-codex-apply-patch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the mirror
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.13"
          enable-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.1

      - name: Configure the sync identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync, build, and mirror releases
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./sync/update.sh

      - name: Upload the main-branch binary
        if: steps.update.outputs.built == 'true' && steps.update.outputs.mode == 'main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apply-patch-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
