name: Sync OpenAI Codex apply-patch

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-openai-codex-apply-patch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      XWIN_ARCH: x86_64
      XWIN_CACHE_DIR: ${{ runner.temp }}/cargo-xwin
      XWIN_VERSION: "17"
    outputs:
      built: ${{ steps.update.outputs.built }}
      mode: ${{ steps.update.outputs.mode }}
      release_plan: ${{ steps.update.outputs.release_plan }}
    steps:
      - name: Check out the mirror
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.13"
          enable-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu,x86_64-pc-windows-msvc

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: package-targets-v1
          workspaces: ". -> target"

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.1

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      - name: Install cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin@0.23.0

      - name: Restore the Windows SDK cache
        id: xwin-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: xwin-${{ runner.os }}-${{ runner.arch }}-cargo-xwin-0.23.0-v17-x86_64-v1

      - name: Prepare the Windows SDK
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        run: cargo xwin cache xwin

      - name: Save the Windows SDK cache
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: ${{ steps.xwin-cache.outputs.cache-primary-key }}

      - name: Install LLVM tools for Windows cross-compilation
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends llvm-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Configure the sync identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync, build, and mirror releases
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./sync/update.sh

      - name: Upload the main-branch binaries
        if: steps.update.outputs.built == 'true' && steps.update.outputs.mode == 'main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apply-patch-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish-macos-arm64:
    needs: sync
    if: needs.sync.outputs.mode == 'release'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out the synchronized mirror
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: package-targets-v1
          workspaces: ". -> target"

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.1

      - name: Configure the sync identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and publish macOS ARM64 release bundles
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLAN: ${{ needs.sync.outputs.release_plan }}
        run: ./sync/publish-macos-arm64.sh
